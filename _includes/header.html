<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" id="site-header">
  <div class="container">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name }}, home">
      <img src="{{ '/assets/images/profile.png' | relative_url }}" alt="" width="36" height="36">
      <span class="brand-text">
        <span class="brand-name">{{ site.data.profile.name }}</span>
        <span class="brand-sub">{{ site.data.profile.tagline }}</span>
      </span>
    </a>
    <nav class="nav" id="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.menus.main %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark theme">
      {% include icon.html name="moon" class="icon-moon" %}{% include icon.html name="sun" class="icon-sun" %}
    </button>
    <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      {% include icon.html name="menu" class="icon-menu" %}{% include icon.html name="close" class="icon-close" %}
    </button>
  </div>
</header>
