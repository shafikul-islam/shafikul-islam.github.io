<svg class="tl-svg" viewBox="0 0 760 300" role="img" aria-label="An X-ray of the thoracic spine is scanned in one pass. A box appears around a suspected fractured vertebra in about 126 milliseconds.">
  <rect x="200" y="20" width="360" height="260" rx="12" fill="#0e1520"/>
  <g class="x-spine">
    <rect x="345" y="36" width="70" height="22" rx="7"/><rect x="343" y="64" width="74" height="22" rx="7"/>
    <rect x="341" y="92" width="78" height="22" rx="7"/><rect x="340" y="120" width="80" height="22" rx="7"/>
    <path d="M340 150h80l-6 18h-68z"/><rect x="338" y="176" width="84" height="22" rx="7"/>
    <rect x="337" y="204" width="86" height="22" rx="7"/><rect x="336" y="232" width="88" height="22" rx="7"/>
  </g>
  <path d="M260 60 C300 150 300 170 262 260M500 60 C460 150 460 170 498 260" stroke="#6b7a8c" stroke-width="10" fill="none" opacity=".35"/>
  <rect x="200" y="20" width="360" height="4" class="x-scan"/>
  <g class="x-box">
    <rect x="326" y="143" width="108" height="32" rx="3" fill="none" stroke="var(--il-fail)" stroke-width="3"/>
    <rect x="434" y="143" width="112" height="20" rx="3" fill="var(--il-fail)"/>
    <text x="440" y="157" style="fill:#fff;font-weight:500">suspected fracture</text>
  </g>
  <g transform="translate(20 70)">
    <text class="tl-title" x="0" y="0">Single-stage detector</text>
    <text x="0" y="24">YOLOv8 looks at the</text><text x="0" y="40">whole image in one pass</text>
    <text x="0" y="72" style="fill:var(--accent-ink);font-weight:500">about 126 ms per X-ray</text>
    <text x="0" y="88">on a mid-range GPU</text>
  </g>
  <g transform="translate(590 70)">
    <text class="tl-title" x="0" y="0">Output</text>
    <text x="0" y="24">bounding box +</text><text x="0" y="40">confidence score</text>
    <text x="0" y="72">flags cases for</text><text x="0" y="88">faster review</text>
  </g>
</svg>
<style>
.x-spine rect, .x-spine path { fill: #c9d3de; opacity: .85; }
.x-scan { fill: var(--il-twin); opacity: .8; animation: scan 3s linear infinite; }
.x-box { opacity: 0; animation: xbox 3s infinite; }
@keyframes scan { 0% { transform: translateY(0); } 60% { transform: translateY(256px); opacity: .8; } 61%, 100% { transform: translateY(256px); opacity: 0; } }
@keyframes xbox { 0%, 55% { opacity: 0; } 62%, 95% { opacity: 1; } 100% { opacity: 0; } }
</style>
