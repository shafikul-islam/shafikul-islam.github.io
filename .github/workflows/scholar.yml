name: Update citation metrics

# Refreshes _data/scholar.yml on the 1st and 16th of each month (about every 15 days).
# Uses SearchApi through the SEARCHAPI_KEY repository secret, one search credit per run.
# If the request fails, the script keeps the last good data and nothing is committed.
on:
  schedule:
    - cron: "17 6 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Scholar metrics
        env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
        run: python3 _tools/update_scholar.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/scholar.yml; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/scholar.yml
            git commit -m "Update citation metrics from Google Scholar"
            git push
          fi
